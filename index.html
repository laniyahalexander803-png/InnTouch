<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnTouch - Hotel Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>InnTouch</h1>
        <p>Book your perfect stay seamlessly</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Find a Room</h2>
            <form id="booking-form">
                <label for="checkin">Check-in Date:</label>
                <input type="date" id="checkin" required>

                <label for="checkout">Check-out Date:</label>
                <input type="date" id="checkout" required>

                <label for="guests">Guests:</label>
                <input type="number" id="guests" min="1" max="10" value="1" required>

                <button type="submit">Search Availability</button>
            </form>
            <div id="error-message" style="color: red; margin-top: 10px;"></div>
            <div id="results" style="margin-top: 15px;"></div>
            <div id="reservation-summary" style="margin-top: 20px;"></div>
        </section>
    </main>
    <script src="searchValidator.js"></script>
    <script src="searchStorage.js"></script>
    <script src="reservationCalculator.js"></script>
    <script src="script.js"></script>
</body>
</html>
